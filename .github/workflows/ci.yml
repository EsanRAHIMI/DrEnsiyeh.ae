name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/drensiyeh
      APP_BASE_URL: http://localhost:3000
      DEPLOY_ENV: ci
      EMAIL_TRANSPORT: file
      AUTH_REQUEST_LIMIT: "200"
      SEED_DOCTOR_EMAIL: doctor@drensiyeh.test
      SEED_ADMIN_EMAIL: admin@drensiyeh.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drensiyeh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate ephemeral secrets
        run: |
          echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "TOKEN_PEPPER=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "BOOKING_TOKEN_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> $GITHUB_ENV
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - name: E2E + accessibility
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000/en --timeout 60000
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
